<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<!-- //radial-gradient(circle,rgba(122,6,138,1)_0%,rgba(242,240,245,1)_55%,rgba(104,164,232,1)_100%) -->
 <!-- radial-gradient(circle,rgba(174,82,196,1)_0%,rgba(239,237,242,1)_57%,rgba(233,240,247,1)_100%) -->
<body class=" bg-[radial-gradient(circle,rgba(144,7,179,1)_0%,rgba(239,237,242,1)_57%,rgba(233,240,247,1)_100%)]">
    <div class="">
        <form action="" class="max-w-md mx-auto  px-16 py-12 bg-white border border-gray-200 rounded-md mt-4 space-y-2"
            id="form">
            <p class="text-green-500 text-lg text-center hidden" id="message">Inscription reussie</p>
            <div class="text-center text-purple-900 font-bold text-xl">Inscription</div>
            <div class=" flex flex-col">
                <label for="" class="text-gray-700 font-medium">Nom complet:</label>
                <input type="text"
                    class="border border-gray-300 h-10 rounded-md  focus:outline-none focus:ring-1 focus:border-purple-500 focus:ring-purple-500 p-[20px]"
                    id="name">
                <p id="error-name" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="flex flex-col">
                <label for="" class="text-gray-700 font-medium">Adresse email:</label>
                <input type="text"
                    class="border border-gray-300 h-10 rounded-md  focus:outline-none focus:ring-1 focus:border-purple-500 focus:ring-purple-500 p-[20px]"
                    id="mail">
                <p id="error-mail" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="flex flex-col">
                <label for="" class="text-gray-700 font-medium">Mot de passe:</label>
                <div class="relative mt-1">
                    <input type="password"
                        class="border border-gray-300 h-10 rounded-md w-full px-3 pr-10  focus:outline-none focus:ring-1 focus:border-purple-500 focus:ring-purple-500 p-[20px]"
                        id="password1">
                    <button type="button" id="toggle-password1"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-purple-600 cursor-pointer">

                        <svg id="eye-open-password1" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>


                        <svg id="eye-closed-password1" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye-off preview-icon hidden">
                            <path
                                d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                            <path
                                d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                            <path d="m2 2 20 20" />
                        </svg>
                    </button>
                </div>
                <p id="error-password1" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="flex flex-col">
                <label for="" class="text-gray-700 font-medium">Confirmer le mot de passe:</label>
                <div class="relative mt-1">
                    <input type="password"
                        class="border border-gray-300 h-10 rounded-md w-full px-3 pr-10  focus:outline-none focus:ring-1 focus:border-purple-500 focus:ring-purple-500 p-[20px]"
                        id="password2">
                    <button type="button" id="toggle-password2"
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500 hover:text-purple-600 cursor-pointer">

                        <svg id="eye-open-password2" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye preview-icon">
                            <path
                                d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>


                        <svg id="eye-closed-password2" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-eye-off preview-icon hidden">
                            <path
                                d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
                            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
                            <path
                                d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
                            <path d="m2 2 20 20" />
                        </svg>
                    </button>
                </div>
                <p id="error-password2" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="">
                <input type="checkbox" class="border focus:outline-none cursor-pointer" id="terms">
                <label for="" class="text-gray-700 text-xs">En cochant cette case, vous acceptez <a href=""><label
                            class="text-purple-500 text-xs underline cursor-pointer">les politiques de
                            confidentialite</label></a></label>
                <p id="error-terms" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>

            <div class="text-center">
                <button type="submit"
                    class="py-2 w-full rounded-md bg-purple-900 text-white font-bold cursor-pointer"
                    id="btnSubmit">S'inscrire</button>
            </div>
            <div class="class">
                <p class="text-center text-gray-700">ou</p>
            </div>
            <div class="space-y-2">
                <div
                    class="flex justify-center py-2 w-full border border-gray-300 rounded-full text-gray-700 hover:border-purple-500 hover:bg-purple-100 cursor-pointer space-x-2">
                    <img src="images/img1.icons8.png" alt="" class="h-6 w-6">
                    <p class="">
                        Continuer avec Google</p>
                </div>

                <div
                    class="flex justify-center py-2 w-full border border-gray-300 rounded-full text-gray-700 hover:border-purple-500 hover:bg-purple-100 cursor-pointer space-x-2">
                    <img src="images/img.icons8.png" alt="" class="h-6 w-6">
                    <p class="">
                        Continuer avec Facebook</p>
                </div>
                    <div
                    class="flex justify-center py-2 w-full border border-gray-300 rounded-full text-gray-700 hover:border-purple-500 hover:bg-purple-100 cursor-pointer space-x-2">
                    <img src="images/png-clipart-apple-logo-apple-logo-heart-logo-thumbnail.png" alt="" class="h-6 w-6">
                    <p class="">
                        Continuer avec Apple</p>
                </div>
   
            </div>

            <div class="text-center text-sm">
                <p class="text-gray-700">Vous avez deja un compte ? <a href=""><label for=""
                            class="text-purple-900 cursor-pointer font-bold">Se connecter</label> </a></p>
            </div>
        </form>
    </div>
    <script src="form-inscription.js"></script>
</body>


</html>
