<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body>
    <div class="">

        <form action="" class="max-w-md mx-auto mt-8 p-16 bg-white border border-gray-200 rounded-md mt-16 space-y-6"
            id="form">
            <p class="text-green-500 text-lg text-center hidden" id="message" >Inscription reussie</p>
            <div class="text-center text-orange-600 font-bold text-xl">Inscription</div>
            <div class=" flex flex-col">
                <label for="" class="text-gray-700 font-medium">Nom complet:</label>
                <input type="text"
                    class="border border-gray-300 h-10 rounded-md  focus:outline-none focus:ring-1 focus:border-orange-500 focus:ring-orange-500"
                    id="name">
                <p id="error-name" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="flex flex-col">
                <label for="" class="text-gray-700 font-medium">Adresse email:</label>
                <input type="text"
                    class="border border-gray-300 h-10 rounded-md  focus:outline-none focus:ring-1 focus:border-orange-500 focus:ring-orange-500"
                    id="mail">
                <p id="error-mail" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="flex flex-col">
                <label for="" class="text-gray-700 font-medium">Mot de passe:</label>
                <input type="password"
                    class="border border-gray-300 h-10 rounded-md  focus:outline-none focus:ring-1 focus:border-orange-500 focus:ring-orange-500"
                    id="password1">
                <p id="error-password1" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="flex flex-col">
                <label for="" class="text-gray-700 font-medium">Confirmer le mot de passe:</label>
                <input type="password"
                    class="border border-gray-300 h-10 rounded-md  focus:outline-none focus:ring-1 focus:border-orange-500 focus:ring-orange-500"
                    id="password2">
                <p id="error-password2" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
            <div class="">
                <input type="checkbox" class="border focus:outline-none " id="terms">
                <label for="" class="text-gray-700">J'accepte les conditions d'utilisation</label>
                  <p id="error-terms" class="text-red-500 text-xs mt-1 hidden"></p>
            </div>
          
            <div class="text-center">
                <button type="submit"
                    class="py-2 px-4 rounded-md bg-orange-500 text-white font-bold animate-pulse cursor-pointer"
                    id="btnSubmit">S'inscrire</button>
            </div>
        </form>
    </div>
<script src="form-inscription.js"></script>
</body>


</html>
