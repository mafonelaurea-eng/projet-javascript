                <th class=" px-4 py-3 text-left font-semibold text-gray-900">Nombre</th>
                <th class="px-4 py-3 text-left font-semibold text-gray-900">Tache</th>

        </thead>

            <tr>
                <td>
                    
                </td>
            </tr>

    </table>
    </div>

    <div class="hidden flex justify-center items-center bg-black/40 fixed inset-0 w-full h-full" id="formulaire">
        <form action="" class=" max-w-md mx-auto mt-8 p-6 bg-white border border-gray-300 flex flex-col">
            <label for="nom" class="text-gray-500 text-md font-medium">Nom de la tache</label>
            <input type="text" placeholder="Entrer votre nom" class="border b rounded-md p-2">
            <label for="date" class="text-gray-500 text-md font-medium">date debut</label>
            <input type="date" placeholder="" class="border rounded-md p-2">
                <label for="date" class="text-gray-500 text-md font-medium">date fin</label>
            <input type="date" placeholder="" class="border rounded-md p-2">
            <button type="submit"
                class="text-lg bg-blue-600  px-1 py-2 text-white rounded-md mt-4 ">Enregistrer</button>
        </form>
    </div>
<script src="todo-list.js"></script>
